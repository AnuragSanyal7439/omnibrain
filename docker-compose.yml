services:
  api:
    build: .
    env_file:
      - .env.example
    environment:
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: sqlite:///./data/omnibrain.db
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/data/uploads
      - extracted_images:/app/data/extracted_images
      - sqlite_data:/app/data
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  qdrant:
    image: qdrant/qdrant:v1.11.5
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  qdrant_storage:
  uploads:
  extracted_images:
  sqlite_data:

